name: Build web corpus

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_web_corpus.py'
      - '.github/workflows/build-corpus.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check PyMuPDF
      - name: Build searchable corpus
        run: python scripts/build_web_corpus.py
      - name: Publish corpus payload
        run: |
          mkdir -p data
          cp .build_corpus/data/corpus.json.gz.b64 data/corpus.json.gz.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/corpus.json.gz.b64
          if git diff --cached --quiet; then
            echo 'Corpus unchanged.'
          else
            git commit -m 'Build searchable corpus payload'
            git push
          fi
